<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="assets/img/icon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <title>Bankist | Premium Dashboard</title>
    <link rel="stylesheet" href="assets/css/banking.css" />
  </head>
  <body>
    <nav>
      <div class="nav__left">
        <p class="welcome" id="label-welcome">Log in to get started</p>
        <a href="index.html"
          ><img src="assets/img/logo.png" alt="Logo" class="logo"
        /></a>
      </div>
      <div class="nav__btns">
        <button
          id="dark-mode-toggle"
          class="btn--nav"
          aria-label="Toggle dark mode"
          title="Toggle Theme"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <g class="sun">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
            <path
              class="moon"
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
            />
          </svg>
        </button>
        <button
          id="btn-reset"
          class="btn--nav"
          title="Reset All Data"
          style="color: #3b82f6"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button class="logout-btn" id="btn-logout" title="Exit Session">
          Logout
        </button>
      </div>
    </nav>

    <div id="toast" class="toast"></div>

    <main class="app" id="container-app">
      <div class="header-section">
        <div class="balance">
          <p class="balance__label">Available Balance</p>
          <p class="balance__date">
            Last updated: <span id="label-date">00/00/0000</span>
          </p>
          <p class="balance__value" id="label-balance">0000€</p>
        </div>

        <div class="summary-cards">
          <div class="summary-card summary-card--in">
            <p class="summary-card__label">Total Income</p>
            <p class="summary-card__value" id="label-sum-in">0€</p>
          </div>
          <div class="summary-card summary-card--out">
            <p class="summary-card__label">Total Expenses</p>
            <p class="summary-card__value" id="label-sum-out">0€</p>
          </div>
          <div class="summary-card summary-card--interest">
            <p class="summary-card__label">Accrued Interest</p>
            <p class="summary-card__value" id="label-sum-interest">0€</p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="movements-container">
          <div class="movements__header">
            <h3 class="movements__title">Recent Transactions</h3>
            <button class="btn--sort" id="btn-sort" title="Sort Transactions">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="M3 6h18M6 12h12m-9 6h6" />
              </svg>
              SORT
            </button>
          </div>
          <div class="movements" id="container-movements"></div>
        </div>
      </div>

      <div class="sidebar">
        <div class="sidebar-inner">
          <div class="operation operation--transfer">
            <h2>Transfer money</h2>
            <form class="form" id="form-transfer">
              <div class="form__group">
                <label class="form__label">Recipient</label>
                <input
                  type="text"
                  class="form__input"
                  id="input-transfer-to"
                  placeholder="Username"
                  required
                />
              </div>
              <div class="form__group">
                <label class="form__label">Amount</label>
                <input
                  type="number"
                  class="form__input"
                  id="input-transfer-amount"
                  placeholder="0.00"
                  required
                />
              </div>
              <button class="form__btn">Send Transfer &rarr;</button>
            </form>
          </div>

          <div class="operation operation--request">
            <h2>Request money</h2>
            <form class="form" id="form-request">
              <div class="form__group">
                <label class="form__label">Request from</label>
                <input
                  type="text"
                  class="form__input"
                  id="input-request-to"
                  placeholder="Username"
                  required
                />
              </div>
              <div class="form__group">
                <label class="form__label">Amount</label>
                <input
                  type="number"
                  class="form__input"
                  id="input-request-amount"
                  placeholder="0.00"
                  required
                />
              </div>
              <button class="form__btn">Send Request &rarr;</button>
            </form>
          </div>

          <div class="operation operation--loan">
            <h2>Request loan</h2>
            <form class="form" id="form-loan">
              <div class="form__group">
                <label class="form__label">Loan Amount</label>
                <input
                  type="number"
                  class="form__input"
                  id="input-loan-amount"
                  placeholder="0.00"
                  required
                />
              </div>
              <button class="form__btn">Get Instant Loan &rarr;</button>
            </form>
          </div>

          <div class="operation operation--close">
            <h2>Close account</h2>
            <form class="form" id="form-close">
              <div class="form__group">
                <label class="form__label">Username</label>
                <input
                  type="text"
                  class="form__input"
                  id="input-close-user"
                  placeholder="Confirm username"
                  required
                />
              </div>
              <div class="form__group">
                <label class="form__label">PIN</label>
                <input
                  type="password"
                  class="form__input"
                  maxlength="4"
                  id="input-close-pin"
                  placeholder="••••"
                  required
                />
              </div>
              <button class="form__btn" style="background: #be123c">
                Close My Account
              </button>
            </form>
          </div>
        </div>
      </div>

      <p class="timer-label">
        Session ends in <span id="label-timer">05:00</span>
      </p>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/banking.js"></script>
  </body>
</html>
